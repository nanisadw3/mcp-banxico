name: Publicar en PyPI

# Se dispara al publicar una release en GitHub.
on:
  release:
    types: [published]
  workflow_dispatch:      # permite lanzarlo a mano desde la pestaña Actions

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      id-token: write     # necesario para Trusted Publishing; no guarda ningún secreto
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Construir el paquete
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Verificar los metadatos
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Publicar en PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
